add_newline = true

[username]
style_user = "white bold"
style_root = "black bold"
format = "user: [$user]($style) "
disabled = false

[character]
success_symbol = "🍺"
error_symbol = "[✗](bold red) "

[directory]
truncate_to_repo = false

[time]
disabled = false

[git_branch]
symbol = "🌱 "

[nodejs]
format = "via [🤖 $version](bold green) "

[docker_context]
format = "via [🐋 $context](blue bold)"

[terraform]
format = "[🏎💨 $version$workspace]($style) "